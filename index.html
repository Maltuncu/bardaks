      if(!ok) throw new Error('session yok');

const TL = n => (Number(n)||0).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' ₺';
// [TR-PARA-1] Türkçe para girişi: "20.000"→20000 · "13.540,00"→13540 · "1.500.000"→1500000 · "20,5"→20.5 · "20.5"→20.5
// SEBEP: type=number + parseFloat, "20.000"u 20 olarak alıyordu (Hamzaoğlu 20.000→20, Arapoğlu 13.540→13,54 vakası)
function trNum(v){
  if(v===null||v===undefined) return NaN;
  var s=String(v).trim().replace(/[\s ₺]|TL/gi,'');
  if(!s) return NaN;
  var neg=/^-/.test(s); s=s.replace(/^[-+]/,'');
  var hasComma=s.indexOf(',')>=0, hasDot=s.indexOf('.')>=0;
  if(hasComma && hasDot){ s=s.replace(/\./g,'').replace(',','.'); }        // 13.540,00 → nokta=binlik
  else if(hasComma){ s=s.replace(',','.'); }                                // 13540,50 → virgül=ondalık
  else if(hasDot){                                                          // yalnız nokta: 3'lü grup = binlik
    var p=s.split('.');
    if(p.length>2 || p[p.length-1].length===3) s=p.join('');
  }
  var n=Number(s);
  if(!isFinite(n)) return NaN;
  return neg?-n:n;
}
// [TR-PARA-1] input'a canlı "= 20.000,00 ₺" önizlemesi bas (belirsizlik kalmasın)
function trOnizle(inputId, hedefId){
  var i=document.getElementById(inputId), h=document.getElementById(hedefId);
  if(!i||!h) return;
  var n=trNum(i.value);
  h.textContent = (i.value&&isFinite(n)&&n>0) ? ('= '+TL(n)) : '';
}

async function ayKapat(){

  if(!confirm('🔒 '+et+' kapatılacak:\n\n• Teslimi geçmiş HAZIR siparişler → tamamlandı\n• Ayın siparişleri düzenlemeye/silmeye KİLİTLENİR\n• Bekleyen/üretimde olanlara dokunulmaz\n\nGeri almak sipariş başına admin kilit açma gerektirir. Emin misin?')) return;

  if(r.error){ alert('Siparişler okunamadı, tekrar deneyin.'); return; }
  var rows=r.data||[], bugun=today(), hata=null, nT=0, nK=0;

    var kilitle=rows.filter(function(x){return !x.kilitli && x.durum!=='bekleyen' && x.durum!=='uretimde';}).map(function(x){return x.id;});
    if(kilitle.length){
      var r2=await sb.from('siparisler').update({kilitli:true, last_updated_by:'ay kapatma ('+ay+')'}).in('id',kilitle);

    if(r3.error) hata=r3.error;

  try{ await sb.from('bildirimler').delete().eq('tip','siparis_guncellendi').ilike('icerik','%tamamlandi%').gte('olusturma', new Date(Date.now()-3*60000).toISOString()); }catch(e){}

  toast('🔒 '+et+' kapatıldı', nT+' sipariş tamamlandı · '+nK+' kilitlendi');
  ayKapatDurum();
}

async function prsSatirEkle(){

    +'<div style="font-size:13px;color:var(--text-dim);margin-bottom:8px">Tutar: <b>'+TL(tutar)+'</b> — banka/kasa hesabına net giriş yapılır.</div>'
    +'<label>Banka / Kasa Hesabı</label><select id="ctAccount">'+thHesapOptions('havale')+'</select>'
    +'<label>Tahsil / Valör Tarihi</label><input type="date" id="ctValor" value="'+today()+'">'
    +'<button class="btn btn-block mt" id="ctBtn" onclick="cekTahsilEt(\''+id+'\')">Tahsil Et</button>');
}
async function cekTahsilEt(id){
  const acc=val('ctAccount'); const valor=val('ctValor');
  if(!acc){ toast('Tahsil edilemedi','Banka/kasa hesabı seç.'); return; }
  if(!valor){ toast('Tahsil edilemedi','Tahsil/valör tarihi gir.'); return; }
  const btn=document.getElementById('ctBtn'); if(btn){ btn.disabled=true; btn.textContent='İşleniyor...'; }
  const r=await sb.rpc('cek_tahsil_et',{p_tahsilat:id,p_account_id:acc,p_valor:valor});
  if(r.error){ if(btn){ btn.disabled=false; btn.textContent='Tahsil Et'; } toast('Tahsil edilemedi', r.error.message||'RPC hata verdi.'); return; }
  closeModal(); toast('✅ Çek tahsil edildi','Banka/kasa girişi yapıldı.'); renderPanel();
}
async function cekKarsiliksiz(id){
  if(!confirm('Çek KARŞILIKSIZ işaretlensin mi? Firma borcu tekrar açık görünecek.')) return;
  const r=await sb.rpc('cek_karsiliksiz_yap',{p_tahsilat:id});

  toast('Çek karşılıksız işaretlendi','Cari borç geri açıldı.'); renderPanel();
}
async function cekIptal(id){

let maliyetGirisi=[];
async function openMaliyetEksik(){
  const eksik = URUNLER.filter(function(u){return u.satis_urunu!==false && !Number(u.birim_maliyet);});
  if(!eksik.length){ toast('Tüm ürünlerde maliyet var 🎉',''); return; }
  // [MALIYET-V2] ürün bazında toplam adet+ciro (salt-okuma) -> ciro DESC sıralama
  const satMap={};
  try{
    const rk = await sb.from('siparis_kalemleri').select('urun_id,adet,toplam_kdv_haric').eq('is_deleted',false);
    (rk.data||[]).forEach(function(k){ var s=satMap[k.urun_id]||(satMap[k.urun_id]={adet:0,ciro:0}); s.adet+=Number(k.adet||0); s.ciro+=Number(k.toplam_kdv_haric||0); });
  }catch(e){}
  const sirali = eksik.map(function(u){ var s=satMap[u.id]||{adet:0,ciro:0}; return {id:u.id, ad:u.ad, adet:s.adet, ciro:s.ciro}; }).sort(function(a,b){return b.ciro-a.ciro;});
  maliyetGirisi = sirali.map(function(u){return {id:u.id, ad:u.ad, maliyet:0};});
  let h = '<div class="modal-head"><h3>Eksik Maliyetler ('+eksik.length+')</h3><button class="modal-close" onclick="closeModal()">×</button></div>';
  h += '<div style="font-size:12px;color:var(--text-dim);margin-bottom:10px;padding:8px;background:var(--surface2);border-radius:8px">Maliyet yalnız <b>gelecekteki</b> siparişleri etkiler. Geçmiş siparişlerde satış anındaki maliyet snapshot kullanılır. En çok ciro yapan ürünler üstte.</div>';
  h += '<div style="max-height:50vh;overflow-y:auto">';
  h += sirali.map(function(m,i){return '<div class="flex-between" style="padding:8px 0;border-bottom:1px solid var(--border)"><div style="flex:1;min-width:0"><div style="font-size:14px">'+escapeHtml(m.ad)+'</div><div style="font-size:11px;color:var(--text-dim)">'+m.adet+' adet · '+TL(m.ciro)+' ciro</div></div><input type="number" min="0" step="0.01" style="width:90px;text-align:center" placeholder="maliyet ₺" oninput="maliyetGirisi['+i+'].maliyet=Number(this.value)||0"></div>';}).join('');
  h += '</div><button class="btn btn-block mt" onclick="kaydetMaliyetler()">Kaydet</button>';
  openModal(h);
}
async function kaydetMaliyetler(){
  const dolu = maliyetGirisi.filter(function(m){return m.maliyet>0;});
  if(!dolu.length){ alert('En az bir ürüne maliyet gir'); return; }
  for(var i=0;i<dolu.length;i++){
    const r = await sb.from('urunler').update({birim_maliyet:dolu[i].maliyet}).eq('id',dolu[i].id);
    if(r.error){ (console.error('[hata]',r.error),alert('İşlem tamamlanamadı, tekrar deneyin.')); return; }
    const u=URUNLER.find(function(x){return x.id===dolu[i].id;}); if(u) u.birim_maliyet=dolu[i].maliyet;
  }
  closeModal(); toast('✅ '+dolu.length+' ürüne maliyet girildi','Geçmiş kârlar güncellendi'); renderPanel();
}

let siparisFiltre = 'aktif';

    list.innerHTML='<div class="empty"><div class="empty-ico">🧾</div>'+_emsg+'<div style="margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">'+_eact+'</div></div>'; return;
  }
  // [SIP-SEARCH-1] client-side arama + kayıt sayısı — DB'ye tekrar sorgu YOK, kartları gizler

  list.innerHTML = _sara + r.data.map(function(s){

// [SIP-SEARCH-1] eşleşmeyen kartları gizle (firma adı + sipariş no) — veri/sorgu etkilenmez
function sipFiltrele(){
  var el=document.getElementById('sipAra'); var q=el?String(el.value||'').trim().toLocaleLowerCase('tr'):'';
  var cards=document.querySelectorAll('#siparisList .sip-card'), vis=0;
  cards.forEach(function(c){ var show=!q||(c.getAttribute('data-search')||'').indexOf(q)>=0; c.style.display=show?'':'none'; if(show)vis++; });
  var bos=document.getElementById('sipAraBos'); if(bos) bos.style.display=(q&&vis===0)?'block':'none';
}
function openYeniSiparis(onDate){
  var _d = onDate || today(); // [TAKVIM-FIRST] güne dokununca tarih öne-dolu
  window._ysTeslimManuel=false; // [EDIT-SAFE-1] teslim, kullanıcı elle değiştirene dek sipariş tarihini izler
  window._ysIdem = bkIdem(); // [IDEM-1] bu sipariş oturumunun anahtarı
  const firmaOpts = FIRMALAR.map(function(f){return '<option value="'+f.id+'">'+f.ad+'</option>';}).join('');
  openModal('<div class="modal-head"><h3>🟢 Yeni Sipariş</h3><button class="modal-close" onclick="closeModal()">×</button></div><div style="background:rgba(31,139,95,.10);border:1px solid rgba(31,139,95,.35);border-radius:8px;padding:8px 10px;font-size:12px;color:#1F8B5F;margin-bottom:10px">Firma seç → tarih → ürünlere adet gir → Kaydet.</div><label>1) Firma</label><select id="ysFirma" onchange="ysLoadUrunler()">'+firmaOpts+'</select><label class="mt">2) Sipariş Tarihi <span style="color:var(--text-dim);font-weight:400">— geçmiş tarih de seçebilirsin</span></label><input type="date" id="ysTarih" value="'+_d+'" onchange="if(!window._ysTeslimManuel){var t=document.getElementById(\'ysTeslim\');if(t)t.value=this.value;}"><label class="mt">Teslim Tarihi</label><input type="date" id="ysTeslim" value="'+_d+'" onchange="window._ysTeslimManuel=true"><div id="ysUrunler" class="mt"></div><div id="ysFooter" style="position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 0 4px;margin-top:8px"><div id="ysToplam" style="font-weight:800;font-size:20px;text-align:right;margin-bottom:8px"></div><button id="ysKaydetBtn" class="btn btn-block" style="font-size:16px;padding:14px;min-height:48px" onclick="kaydetSiparis()">Siparişi Kaydet</button></div>');
  ysLoadUrunler();
}
var ysSatirlar = [];
  function ysLoadUrunler(){
  const fid = document.getElementById('ysFirma').value;
  const fiyatlar = FIYATLAR.filter(function(p){return p.firma_id===fid;});
  ysSatirlar = fiyatlar.map(function(p){return {urun_id:p.urun_id, ad:p.urun_ad, fiyat:p.birim_fiyat_kdv_haric, kdv:p.kdv_orani, adet:0};});
  const c = document.getElementById('ysUrunler');
  if(!ysSatirlar.length){ c.innerHTML='<div class="empty">Bu firmaya tanımlı ürün yok. Önce Firmalar ekranından ürün ekle.</div>'; return; }
  // [ORDER-SEARCH-1] uzun katalogda ürün arama — satırları GİZLER (silmez), girilen adetler/toplam korunur
  var _ara = ysSatirlar.length>4 ? '<input type="search" id="ysAra" placeholder="🔍 Ürün ara (isim yaz)…" autocomplete="off" oninput="ysFilter()" style="margin-bottom:8px;min-height:44px">' : '';
  // [ORDER-REPEAT-1] firmanın son (iptal olmayan) siparişini forma doldur — salt-okunur, kayıt yine RPC ile
  var _tekrar = '<button id="ysTekrarBtn" class="btn btn-sec btn-block" style="margin-bottom:12px;min-height:46px;font-weight:700;border:2px solid var(--accent);color:var(--accent)" onclick="ysSonSiparis()">↻ Son Siparişi Tekrarla</button>';
  c.innerHTML = _tekrar + '<label>3) Ürünler — istediğine adet gir <span style="color:var(--text-dim);font-weight:400">('+ysSatirlar.length+' ürün)</span></label>' + _ara + ysSatirlar.map(function(s,i){return '<div class="flex-between ys-row" data-ad="'+String(s.ad).toLocaleLowerCase('tr').replace(/"/g,'')+'" style="padding:8px 0; border-bottom:1px solid var(--border)"><div><div>'+s.ad+'</div><div style="font-size:12px;color:var(--text-dim)">'+TL(s.fiyat)+'/birim (KDV hariç)</div></div><input type="number" min="0" step="1" inputmode="numeric" data-ys-idx="'+i+'" style="width:84px; text-align:center; min-height:44px; font-size:16px" value="0" oninput="ysSync(this); ysHesap()" onchange="ysSync(this); ysHesap()"></div>';}).join('') + '<div id="ysAraBos" class="empty" style="display:none;padding:20px">Eşleşen ürün yok.</div>';
  ysHesap();
}
// P0 DOM-SOURCE FALLBACK: adet'i tek doğruluk kaynağı olarak DOM input'larından oku (state kaybına karşı sağlamlaştırma)
function ysAdetOf(inp){ return Math.max(0, Math.floor(Number(inp && inp.value)||0)); }
function ysSync(inp){ var i=+inp.getAttribute('data-ys-idx'); if(ysSatirlar[i]) ysSatirlar[i].adet = ysAdetOf(inp); }
function ysReadFromDOM(){
  var inputs = document.querySelectorAll('#ysUrunler input[data-ys-idx]');
  inputs.forEach(function(inp){ var i=+inp.getAttribute('data-ys-idx'); if(ysSatirlar[i]) ysSatirlar[i].adet = ysAdetOf(inp); });
}
function ysHesap(){
  ysReadFromDOM();
  let t = ysSatirlar.reduce(function(s,r){return s + (r.adet||0)*r.fiyat*(1+r.kdv/100);}, 0);
  document.getElementById('ysToplam').textContent = 'Toplam (KDV dahil): '+TL(t);
}
// [ORDER-SEARCH-1] arama: eşleşmeyen satırları gizle; adetler DOM'da kalır → toplam & kayıt etkilenmez
function ysFilter(){
  var el=document.getElementById('ysAra'); var q=el?String(el.value||'').trim().toLocaleLowerCase('tr'):'';
  var rows=document.querySelectorAll('#ysUrunler .ys-row'), vis=0;
  rows.forEach(function(r){ var show=!q||(r.getAttribute('data-ad')||'').indexOf(q)>=0; r.style.display=show?'':'none'; if(show)vis++; });
  var bos=document.getElementById('ysAraBos'); if(bos) bos.style.display=(q&&vis===0)?'block':'none';
}
// [ORDER-REPEAT-1] son siparişi oku ve adetleri doldur — MUTATION YOK, sadece SELECT; katalogda olmayan ürünler atlanır
async function ysSonSiparis(){
  var fid=(document.getElementById('ysFirma')||{}).value; if(!fid) return;
  var btn=document.getElementById('ysTekrarBtn'); if(btn){ btn.disabled=true; btn.textContent='Yükleniyor…'; }
  try{
    var rs=await sb.from('siparisler').select('id').eq('firma_id',fid).neq('durum','iptal').order('tarih',{ascending:false}).limit(1);
    if(rs.error){ console.error('[son-siparis]',rs.error); toast('Okunamadı','Tekrar deneyin'); return; }
    if(!rs.data||!rs.data.length){ toast('Geçmiş sipariş yok','Bu firma için önceki sipariş bulunamadı'); return; }
    var rk=await sb.from('siparis_kalemleri').select('urun_id,adet').eq('siparis_id',rs.data[0].id);
    if(rk.error){ console.error('[son-siparis-kalem]',rk.error); toast('Okunamadı','Tekrar deneyin'); return; }
    if(!rk.data||!rk.data.length){ toast('Geçmiş sipariş boş',''); return; }
    var applied=0, missing=0;
    rk.data.forEach(function(k){
      var i=ysSatirlar.findIndex(function(s){return s.urun_id===k.urun_id;});
      if(i>=0){ ysSatirlar[i].adet=Math.max(0,Math.floor(Number(k.adet)||0));
        var inp=document.querySelector('#ysUrunler input[data-ys-idx="'+i+'"]'); if(inp) inp.value=ysSatirlar[i].adet; applied++;
      } else missing++;
    });
    ysHesap();
    toast('↻ Son sipariş yüklendi', applied+' ürün dolduruldu'+(missing?' · '+missing+' ürün artık listede yok':''));
  } finally { if(btn){ btn.disabled=false; btn.textContent='↻ Son siparişi tekrarla'; } }
}
// [IDEM-1] sunucu idempotency anahtarı — modal açılışında üretilir, retry aynı anahtarı kullanır (çift kayıt imkansız)
function bkIdem(){ return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():null; }
var _sipBusy=false; // [FIX-4] çift-tık / mükerrer sipariş guard
async function kaydetSiparis(){
  if(_sipBusy) return; // [FIX-4] devam eden kayıt varken ikinci tık yok
  const fid = document.getElementById('ysFirma').value;
  const tarih = document.getElementById('ysTarih').value;
  const teslim = (document.getElementById('ysTeslim')||{}).value || tarih;
  ysReadFromDOM();
  const dolu = ysSatirlar.filter(function(s){return s.adet>0;});
  if(!dolu.length){ alert('En az bir ürüne adet gir'); return; }
  if(dolu.some(function(s){return !s.urun_id;})){ alert('Katalog dışı ürün var — kaydedilemez. Tüm ürünler master katalogdan seçilmelidir.'); return; }
  // [NEG-MARGIN] maliyetin altında satış uyarısı (maliyet bilinen ürünlerde)
  const _zarar=dolu.filter(function(s){var m=Number((URUNLER.find(function(u){return u.id===s.urun_id;})||{}).birim_maliyet)||0; return m>0 && Number(s.fiyat)<m;});
  if(_zarar.length && !confirm(_zarar.length+' ürün maliyetin ALTINDA satılıyor (zarar): '+_zarar.map(function(s){return s.ad;}).join(', ')+'. Yine de kaydet?')){ return; }
  // [NO-COST-GUARD] maliyeti girilmemiş ürün uyarısı — satış anında maliyet 0 olarak DONAR, kâr yanlış hesaplanır
  const _msz=dolu.filter(function(s){var m=Number((URUNLER.find(function(u){return u.id===s.urun_id;})||{}).birim_maliyet)||0; return m<=0;});
  if(_msz.length && !confirm('⚠ '+_msz.length+' ürünün MALİYETİ GİRİLMEMİŞ: '+_msz.map(function(s){return s.ad;}).join(', ')+'.\n\nBu siparişin kârı YANLIŞ hesaplanır (maliyet 0 olarak kaydolur ve sonradan düzelmez).\nÖnce Ürünler ekranından maliyet girmen daha doğru.\n\nYine de kaydet?')){ return; }
  const kalemler = dolu.map(function(s){return { urun_id:s.urun_id, urun_ad:s.ad, adet:s.adet, birim_fiyat_kdv_haric:s.fiyat, kdv_orani:s.kdv };});
  _sipBusy=true; // [FIX-4] kilitle (RPC öncesi)
  var _btn=document.getElementById('ysKaydetBtn'); if(_btn){ _btn.disabled=true; _btn.textContent='Kaydediliyor…'; }
  try{
    const r = await sb.rpc('siparis_kaydet', { p_firma:fid, p_tarih:tarih, p_teslim:teslim, p_kalemler:kalemler, p_idempotency_key:window._ysIdem||null }); // [ORDER-RPC-1][IDEM-1] atomik + idempotent
    if(r.error){ console.error('[siparis] rpc hatası:', r.error); alert('Kayıt sonucu belirsiz.\nListeyi kontrol edin.\nKayıt varsa tekrar eklemeyin.\nYoksa tekrar deneyin.'); return; }

// ===== PRODUCTION PULSE (PP-2) — ürün-bazlı üretim merkezi; Liste görünümü korunur =====
let uretimGorunum = 'liste';

async function renderUretim(){
  const el = document.getElementById('page-uretim');

  const rs = await sb.from('siparisler').select('*').in('durum',['bekleyen','uretimde','hazir']).eq('is_deleted',false).order('teslim_tarihi',{ascending:true,nullsFirst:false});

  const siparisler = (rs.data||[]).filter(function(s){
    if(s.durum==='bekleyen'||s.durum==='uretimde') return true; // uretim bekliyor (gecikmis olsa da acil)
    return (s.teslim_tarihi||s.tarih) >= _bugAktif; // [UR-AKTIF-1] gecmis 'hazir' = uretim bitti, board'dan dus
  });
  const ids = siparisler.map(function(s){return s.id;});

  }

  // ---- İMALATHANE KANBAN [UR-KANBAN-1] — 3 durum kolonu (Bekleyen/Üretimde/Hazır) ----
  const bugunStr = today();
  function _adK(n){ return (Number(n)||0).toLocaleString('tr-TR'); }
  function _bekleK(ts){
    if(!ts) return '';
    var ms = Date.now() - new Date(ts).getTime(); if(ms<0) ms=0;
    var dk = Math.floor(ms/60000), sa = Math.floor(dk/60), gn = Math.floor(sa/24);
    if(gn>0) return gn+' g'+((sa%24)?(' '+(sa%24)+' sa'):'');
    if(sa>0) return sa+' sa'+((dk%60)?(' '+(dk%60)+' dk'):'');
    return dk+' dk';
  }
  var kByS = {};
  kalemler.forEach(function(k){ (kByS[k.siparis_id]=kByS[k.siparis_id]||[]).push(k); });
  function kanbanKart(s, onceBu){
    var f = FIRMALAR.find(function(x){return x.id===s.firma_id;})||{};
    var ks = kByS[s.id]||[];
    var toplamAdet = ks.reduce(function(a,k){return a+Number(k.adet||0);},0);

      ? '<button class="btn btn-sm" style="width:100%;min-height:46px" onclick="durumDegistir(\''+s.id+'\',\'uretimde\')">Üretime Al</button>'
      : (s.durum==='uretimde'
        ? '<button class="btn btn-sm" style="width:100%;min-height:46px" onclick="durumDegistir(\''+s.id+'\',\'hazir\')">Hazır</button>'
        : '<span class="tag tag-blue" style="display:block;text-align:center;padding:11px 0">Müdür sevk/fatura</span>');
    var brd = onceBu ? 'border-color:var(--accent);border-width:2px'
      : (ged?'border-color:var(--red);border-width:2px':(s.okunmamis_not?'border-color:var(--blue);border-width:2px':''));
    return '<div class="card" style="padding:11px;margin-bottom:8px;'+brd+'">'
      + (onceBu?'<div style="display:inline-block;background:var(--accent);color:#fff;font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;margin-bottom:6px">ÖNCE BU</div>':'')
      + '<div class="flex-between" style="align-items:flex-start"><strong style="font-size:14px;line-height:1.3">'+(f.ad||'?')+'</strong><span style="font-size:18px;font-weight:800;color:var(--accent);white-space:nowrap">'+_adK(toplamAdet)+'<span style="font-size:11px;color:var(--text-dim);font-weight:400"> adet</span></span></div>'
      + '<div style="font-size:12px;color:var(--text-dim);margin:5px 0;line-height:1.4">'+(ilk2||'kalem yok')+'</div>'
      + '<div style="display:flex;justify-content:space-between;font-size:11px;color:'+(ged?'var(--red)':'var(--text-dim)')+';margin-bottom:8px">'
        + '<span>'+trDate(s.teslim_tarihi||s.tarih)+(ged?' · GECİKTİ':'')+'</span>'

      + '</div>';
  }
  var kol = {bekleyen:[],uretimde:[],hazir:[]};
  siparisler.forEach(function(s){ if(kol[s.durum]) kol[s.durum].push(s); });
  kol.bekleyen.sort(function(a,b){ return String(a.olusturma||a.tarih||'').localeCompare(String(b.olusturma||b.tarih||'')); });
  kol.uretimde.sort(function(a,b){ return String(a.uretimde_at||'').localeCompare(String(b.uretimde_at||'')); });
  kol.hazir.sort(function(a,b){ return String(a.hazir_at||'').localeCompare(String(b.hazir_at||'')); });
  var kolMeta = [['bekleyen','Bekleyen','var(--text)'],['uretimde','Üretimde','var(--accent)'],['hazir','Hazır','var(--blue)']];
  var h = '<div class="flex-between mb"><h1 class="page-title">Üretim</h1>'+uretimToggleHtml()+'</div><div class="page-desc">'+trDate(bugunStr)+' · '+siparisler.length+' aktif · öncelik soldan sağa, en üst kart önce</div>';
  h += '<div style="overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px"><div style="display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:10px;align-items:start">';
  kolMeta.forEach(function(m){
    var key=m[0], list=kol[key];
    var colAdet=list.reduce(function(a,s){var ks=kByS[s.id]||[];return a+ks.reduce(function(x,k){return x+Number(k.adet||0);},0);},0); // [UR-COLSUM-1] kolon üretim yükü (adet)
    h += '<div style="min-width:250px">';

    if(!list.length){ h += '<div class="empty" style="padding:16px;text-align:center;color:var(--text-dim);font-size:12px">—</div>'; }
    list.forEach(function(s,i){ h += kanbanKart(s, key==='bekleyen' && i===0); });
    h += '</div>';
  });
  h += '</div></div>';
  el.innerHTML = h;
}

function renderUretimPulse(el, siparisler, kalemler){
  const bugunStr = today();
  // SAYAÇLAR — Dashboard operasyon satırı ile BİREBİR AYNI tanım (teslim_tarihi||tarih)
  let opTeslim=0, opGeciken=0, opUretimde=0, opHazir=0;
  siparisler.forEach(function(s){ const t=(s.teslim_tarihi||s.tarih); if(t<bugunStr) opGeciken++; else if(t===bugunStr) opTeslim++; if(s.durum==='uretimde') opUretimde++; if(s.durum==='hazir') opHazir++; });
  const sipMap={}; siparisler.forEach(function(s){ sipMap[s.id]=s; });

  Object.keys(eksikMap).forEach(function(sid){ const s=sipMap[sid]; if(s&&s.durum==='hazir') hazirIsaretsiz++; });

    if(s.kilitli) return;
    const key=k.urun_id||('ad:'+k.urun_ad);
    if(!urunler[key]) urunler[key]={uid:k.urun_id, ad:k.urun_ad, toplam:0, uretilen:0, kalan:0, firmalar:{}, sipSet:{}};
    const u=urunler[key];
    u.toplam+=Number(k.adet||0);
    if(k.uretildi_at) u.uretilen+=Number(k.adet||0); else u.kalan+=Number(k.adet||0);
    u.sipSet[s.id]=1;
    const fad=(FIRMALAR.find(function(x){return x.id===s.firma_id;})||{}).ad||'?';
    if(!u.firmalar[fad]) u.firmalar[fad]=[];
    u.firmalar[fad].push({adet:Number(k.adet||0), teslim:(s.teslim_tarihi||s.tarih), isaretli:!!k.uretildi_at, sid:s.id});
  });
  const liste=Object.keys(urunler).map(function(k){return urunler[k];}).filter(function(u){return u.kalan>0;});
  // [UR-ACIL-1] her ürün için en yakın (üretilmemiş) teslim + aciliyet katmanı (0 geciken,1 bugün,2 ileri)

    var minT=null;
    Object.keys(u.firmalar).forEach(function(fad){ u.firmalar[fad].forEach(function(r){ if(r.isaretli) return; if(minT===null || String(r.teslim)<String(minT)) minT=r.teslim; }); });
    u.enYakinTeslim=minT;
    u.tier=(minT===null)?2:(String(minT)<bugunStr?0:(String(minT)===bugunStr?1:2));
  });
  liste.sort(function(a,b){ if(a.tier!==b.tier) return a.tier-b.tier; var at=String(a.enYakinTeslim||'9999-99-99'), bt=String(b.enYakinTeslim||'9999-99-99'); if(at!==bt) return at<bt?-1:1; return b.kalan-a.kalan; });
  var yukToplam=0, yukGeciken=0, yukBugun=0;
  liste.forEach(function(u){ yukToplam+=u.kalan; if(u.tier===0) yukGeciken+=u.kalan; else if(u.tier===1) yukBugun+=u.kalan; });

  let h = '<div class="flex-between mb"><h1 class="page-title">Üretim</h1>'+uretimToggleHtml()+'</div><div class="page-desc">'+trDate(bugunStr)+' · ürün bazlı</div>';
  const sayac=function(lbl,val,col){ return '<div class="stat" style="padding:12px"><div class="stat-label">'+lbl+'</div><div class="stat-value" style="font-size:22px;color:var('+col+')">'+val+'</div></div>'; };
  h += '<div class="stats" style="grid-template-columns:repeat(4,1fr);gap:8px">'
    + sayac('Geciken', opGeciken, opGeciken>0?'--red':'--text')
    + sayac('Bugün', opTeslim, '--accent')
    + sayac('Üretimde', opUretimde, '--text')
    + sayac('Hazır-Sevk', opHazir, opHazir>0?'--green':'--text')
    + '</div>';
  if(liste.length){ h += '<div class="card" style="padding:11px 14px;margin-bottom:10px;display:flex;gap:16px;flex-wrap:wrap;align-items:baseline">'
    + '<span style="font-size:13px;color:var(--text-dim)">Bugünkü üretim yükü</span>'
    + '<span style="font-size:16px;font-weight:800">'+yukToplam+' adet</span>'
    + (yukGeciken>0?'<span style="font-size:14px;color:var(--red);font-weight:800">Geciken '+yukGeciken+'</span>':'')
    + (yukBugun>0?'<span style="font-size:14px;color:var(--accent);font-weight:800">Bugün teslim '+yukBugun+'</span>':'')
    + '<span style="font-size:13px;color:var(--text-dim)">'+liste.length+' ürün</span>'
    + '</div>'; }
  if(hazirIsaretsiz>0){ h += '<div class="card" style="padding:9px 14px;border-color:var(--yellow)"><span style="font-size:13px;color:var(--yellow)">⚠ '+hazirIsaretsiz+' hazır siparişte işaretsiz kalem var (sonradan kalem eklenmiş olabilir)</span></div>'; }
  if((CURRENT.rol==='admin'||CURRENT.rol==='mudur') && _uuLastBatch){

  const dy = new Date(); dy.setDate(dy.getDate()-90); const d90=dy.toISOString().slice(0,10);
  const r = await Promise.all([
    sb.from('cari_ozet').select('firma_id,kalan_bakiye'),
    sb.from('gecmis_aylik_ozet').select('firma_id,kalan_bakiye'),
    sb.from('siparisler').select('firma_id').gte('tarih',d90).neq('durum','iptal').eq('is_deleted',false),
    sb.from('expenses').select('tutar').gte('tarih',d30).eq('is_deleted',false)
  ]);
  const cari=r[0].data||[], gecmis=r[1].data||[], sips=r[2].data||[], gid=r[3].data||[];
  const acikMap={}, gecMap={}, hacimMap={};
  cari.forEach(function(x){acikMap[x.firma_id]=(acikMap[x.firma_id]||0)+Number(x.kalan_bakiye||0);});
  gecmis.forEach(function(x){acikMap[x.firma_id]=(acikMap[x.firma_id]||0)+Number(x.kalan_bakiye||0); gecMap[x.firma_id]=(gecMap[x.firma_id]||0)+Number(x.kalan_bakiye||0);});
  sips.forEach(function(x){hacimMap[x.firma_id]=(hacimMap[x.firma_id]||0)+1;});
  const girisBeklenen = Object.keys(acikMap).reduce(function(s,k){return s+Math.max(0,acikMap[k]);},0);
  const cikisBeklenen = gid.reduce(function(s,x){return s+Number(x.tutar||0);},0);
  const net30 = girisBeklenen - cikisBeklenen;
  function riskHesap(fid){
    const acik=Math.max(0,acikMap[fid]||0), gec=Math.max(0,gecMap[fid]||0), hac=hacimMap[fid]||0;
    return Math.min(100, Math.round((gec>0?45:0) + Math.min(35, acik/2000) + (hac<2?20:(hac<5?10:0))));
  }
  function riskRenk(s){ return s>=67?'var(--red)':(s>=34?'var(--accent)':'var(--green)'); }
  function riskEt(s){ return s>=67?'Yüksek':(s>=34?'Orta':'Düşük'); }
  const firmaList = Object.keys(acikMap).filter(function(k){return (acikMap[k]||0)>1 || (hacimMap[k]||0)>0;});

  let h = '<h1 class="page-title">Risk & Nakit</h1><div class="page-desc">Nakit projeksiyonu + firma risk skorları</div>';
  h += '<div class="card"><div class="card-title">30 Günlük Nakit Projeksiyonu</div><div class="table-wrap"><table><tr><td>Beklenen Tahsilat (açık alacak)</td><td style="text-align:right;color:var(--green);font-weight:700">+'+TL(girisBeklenen)+'</td></tr><tr><td>Beklenen Gider (son 30g baz)</td><td style="text-align:right;color:var(--red)">−'+TL(cikisBeklenen)+'</td></tr><tr><td><strong>Net 30g Projeksiyon</strong></td><td style="text-align:right;font-weight:700;color:var('+(net30>=0?'--green':'--red')+')">'+TL(net30)+'</td></tr></table></div><div style="font-size:11px;color:var(--text-dim);margin-top:6px">Varsayım: açık alacaklar 30 günde tahsil edilir; gider son 30 günün baz alındığı tahmindir.</div></div>';
  h += '<div class="card"><div class="card-title">Firma Risk & Tahsilat</div><div class="table-wrap"><table><tr><th>Firma</th><th style="text-align:right">Toplam Açık</th><th style="text-align:right">Geciken</th><th style="text-align:center">Sip.(90g)</th><th style="text-align:center">Risk</th></tr>';
  h += riskList.map(function(x){return '<tr><td>'+x.ad+'</td><td style="text-align:right">'+TL(x.acik)+'</td><td style="text-align:right;color:'+(x.gec>0?'var(--red)':'var(--text-dim)')+'">'+TL(x.gec)+'</td><td style="text-align:center">'+x.hac+'</td><td style="text-align:center;font-weight:700;color:'+riskRenk(x.risk)+'">'+x.risk+'<div style="font-size:10px;font-weight:400">'+riskEt(x.risk)+'</div></td></tr>';}).join('')||'<tr><td colspan=5 class="empty">Veri yok</td></tr>';
  h += '</table></div><div style="font-size:11px;color:var(--text-dim);margin-top:6px">Risk = geciken ödeme (45p) + açık bakiye büyüklüğü (≤35p) + sipariş seyrekliği (≤20p). Yüksek = dikkat.</div></div>';
  h += '<div class="card"><div class="card-title">Yedekleme</div><div id="yedekDurum" style="font-size:13px;color:var(--text-dim)">Kontrol ediliyor...</div><button class="btn btn-sec mt" onclick="yedekAl()">💾 Yedek Al (JSON indir)</button></div>';
  el.innerHTML = h;
  yedekDurumGoster();
}

async function yedekAl(){

  toast('💾 TAM yedek hazırlanıyor...','Tüm tablolar çekiliyor');
  const TABLOLAR = ['firmalar','urunler','firma_urun_fiyat','siparisler','siparis_kalemleri','siparis_ek_maliyet','siparis_durum_log','siparis_notlari','tahsilatlar','faturalar','expenses','accounts','financial_transactions','firma_odemeleri','gecmis_aylik_ozet','urun_maliyet_gecmisi','firma_urun_log','firma_gorusmeleri','gun_ozetleri','yapilacaklar','rapor_arsiv','teklifler','teklif_kalemleri','ayarlar','batch_records','kullanicilar','state_history','audit_logs','ekip_sohbet','mesajlar','sohbet_okunma'];
  async function _hepsi(tbl){

    while(true){
      var r=await sb.from(tbl).select('*').range(from, from+PAGE-1);
      if(r.error) throw new Error(r.error.message);
      var rows=r.data||[]; out=out.concat(rows);
      if(rows.length<PAGE) break;
      from+=PAGE;
    }
    return out;
  }
  var data={ _meta:{ tarih:new Date().toISOString(), surum:'TAM-v2', alan:CURRENT.ad_soyad } };
  var hatalar=[], toplamSatir=0;

    try{ var rows=await _hepsi(TABLOLAR[i]); data[TABLOLAR[i]]=rows; toplamSatir+=rows.length; }
    catch(e){ hatalar.push(TABLOLAR[i]+': '+(e.message||e)); data[TABLOLAR[i]]=null; }
  }
  data._meta.toplam_satir=toplamSatir; data._meta.atlanan=hatalar;
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download='bardaks_TAM_yedek_'+today()+'.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  await sb.from('ayarlar').upsert({anahtar:'son_yedek_tarihi', deger:today(), aciklama:'Son yedek tarihi'}, {onConflict:'anahtar'});
  toast('✅ TAM yedek indirildi', (TABLOLAR.length-hatalar.length)+'/'+TABLOLAR.length+' tablo · '+toplamSatir+' satır'+(hatalar.length?' ('+hatalar.length+' atlandı)':''));
  yedekDurumGoster();
}

window._foPeriod = window._foPeriod || 'ay';

function _foDupSet(items){
  var dup={};
  for(var i=0;i<items.length;i++){ for(var j=i+1;j<items.length;j++){
    if(Number(items[i].tutar)===Number(items[j].tutar)){
      var d1=new Date(items[i].tarih), d2=new Date(items[j].tarih);

}

        byM[m].forEach(function(x){
          body+='<div class="flex-between" style="padding:6px 0;border-bottom:1px solid var(--border)"><div style="min-width:0"><span style="font-size:13px">'+trDate(x.tarih)+'</span>'+(dup[x.id]?' <span class="tag tag-red">⚠ olası tekrar</span>':'')+(x.aciklama?'<div style="font-size:11px;color:var(--text-dim)">'+escapeHtml(x.aciklama)+'</div>':'')+'</div><div style="text-align:right;flex:0 0 auto"><span style="font-weight:700">'+TL(x.tutar)+'</span> <button class="btn btn-sec btn-sm" onclick="silFirmaOdeme(\''+x.id+'\')">Sil</button></div></div>';

let takvimAy = new Date();

async function renderTakvim(){
  const el = document.getElementById('page-siparis');
  const y = takvimAy.getFullYear(), m = takvimAy.getMonth();
  const ilkGun = new Date(y, m, 1);
  const sonGun = new Date(y, m+1, 0);
  const basStr = ilkGun.toISOString().slice(0,10);
  const bitStr = sonGun.toISOString().slice(0,10);
  const aylar = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];

  el.innerHTML = '<div class="flex-between mb"><h1 class="page-title">Siparişler</h1><div class="row" style="gap:6px"><button class="btn btn-sec btn-sm" onclick="siparisGorunum=\'liste\';renderSiparis()">📋 Liste</button><button class="btn btn-sec btn-sm" onclick="openYeniSiparis()">+ Yeni</button></div></div><div class="card"><div class="flex-between mb"><button class="btn btn-sec btn-sm" onclick="takvimAyDegistir(-1)">← Önceki</button><strong style="font-size:16px">'+aylar[m]+' '+y+'</strong><button class="btn btn-sec btn-sm" onclick="takvimAyDegistir(1)">Sonraki →</button></div><div class="takvim" id="takvimGrid"><div class="loading" style="grid-column:span 7">Yükleniyor...</div></div></div>';

  const r = await sb.from('siparisler').select('id,firma_id,tarih,toplam_kdv_dahil,durum').gte('tarih',basStr).lte('tarih',bitStr).neq('durum','iptal').eq('is_deleted',false);
  const sips = r.data || [];
  const gunMap = {};
  sips.forEach(function(s){
    const t = s.tarih.slice(0,10);
    if(!gunMap[t]) gunMap[t] = { sayi:0, ciro:0 };
    gunMap[t].sayi++;
    gunMap[t].ciro += Number(s.toplam_kdv_dahil||0);
  });
  const maxSayi = Math.max(1, ...Object.values(gunMap).map(function(x){return x.sayi;}));

  const grid = document.getElementById('takvimGrid');
  const gunler = ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
  let html = gunler.map(function(g){return '<div class="takvim-baslik">'+g+'</div>';}).join('');
  let basGun = ilkGun.getDay()-1; if(basGun<0) basGun=6;
  for(let i=0;i<basGun;i++) html += '<div class="takvim-gun bos"></div>';
  const bugun = today();
  for(let d=1; d<=sonGun.getDate(); d++){
    const tarih = y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const veri = gunMap[tarih];
    const yogunluk = veri ? Math.min(4, Math.ceil(veri.sayi/maxSayi*4)) : 0;
    const cls = ['takvim-gun', tarih===bugun?'bugun':'', yogunluk?'l'+yogunluk:''].filter(Boolean).join(' ');
    const info = veri ? '<div class="takvim-gun-info"><strong>'+veri.sayi+' sip.</strong><br>'+TL(veri.ciro)+'</div>' : '';
    html += '<div class="'+cls+'" onclick="acGunDetay(\''+tarih+'\')"><div class="takvim-gun-no">'+d+'</div>'+info+'</div>';
  }
  grid.innerHTML = html;
}

function takvimAyDegistir(yon){
  takvimAy = new Date(takvimAy.getFullYear(), takvimAy.getMonth()+yon, 1);
  renderTakvim();
}

async function yukleUrunFoto(urunId, file){
  const fotoDiv = document.getElementById('foto-'+urunId);
  if(fotoDiv){ const ld=document.createElement('div'); ld.className='foto-yukleniyor'; ld.textContent='Yükleniyor...'; ld.id='ld-'+urunId; fotoDiv.appendChild(ld); }
  try {
    const optimized = await optimizeImage(file, 1000, 0.82);
    const path = urunId + '-' + Date.now() + '.jpg';
    const up = await sb.storage.from('urun-gorselleri').upload(path, optimized, { contentType:'image/jpeg', upsert:false });
    if(up.error) throw up.error;
    const pub = sb.storage.from('urun-gorselleri').getPublicUrl(path);
    const url = pub.data.publicUrl;
    const r = await sb.from('urunler').update({ gorsel_url:url, guncelleme:new Date().toISOString() }).eq('id',urunId);
    if(r.error) throw r.error;
    toast('✅ Görsel yüklendi','');
    renderUrunler();
  } catch(e){
    const ld=document.getElementById('ld-'+urunId); if(ld) ld.remove();
    console.error('[gorsel]',e); alert('Görsel yüklenemedi. Dosya çok büyük olabilir (max 5MB · jpg/png/webp) ya da bağlantı koptu — tekrar deneyin.');
  }
}

function optimizeImage(file, maxW, quality){
  return new Promise(function(resolve, reject){
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){
        let w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(function(blob){ blob ? resolve(blob) : reject(new Error('Dönüştürme hatası')); }, 'image/jpeg', quality);
      };
      img.onerror = function(){ reject(new Error('Geçersiz görsel')); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ reject(new Error('Dosya okunamadı')); };
    reader.readAsDataURL(file);
  });
}

var _sessionKats = []; // [DYN-KAT] bu oturumda eklenen yeni kategoriler
function _allKats(){
  var s=[];
  Object.keys(KAT_ETIKET).forEach(function(k){ s.push(k); });
  (typeof URUNLER!=='undefined'?URUNLER:[]).forEach(function(u){ if(u&&u.kategori) s.push(String(u.kategori)); });
  _sessionKats.forEach(function(k){ s.push(k); });
  var seen={}, out=[];
  s.forEach(function(k){ var key=String(k).toLowerCase().trim(); if(key&&!seen[key]){ seen[key]=1; out.push(k); } });
  return out;
}
function _addSessionKat(k){
  k=String(k||'').trim(); if(!k) return;
  var exists=_allKats().some(function(x){return String(x).toLowerCase()===k.toLowerCase();});
  if(!exists) _sessionKats.push(k);
}
function katOptionsHtml(selected){

  return opts+'<option value="__new__">➕ Yeni Kategori…</option>';
}

      var fiyatHaric = u.varsayilan_fiyat || '';
      var _mal=Number(u.birim_maliyet)||0; // [FL-MARJ-1] maliyet + canlı kâr% yalnız bu ekranda — PDF'e YANSIMAZ
      h += '<div class="fl-row"><label class="fl-check"><input type="checkbox" data-uid="'+u.id+'" class="flCb"><span>'+escapeHtml(u.ad)+(u.gramaj?' <small style="color:var(--text-dim)">('+escapeHtml(u.gramaj)+')</small>':'')+'<div style="font-size:11px;color:var(--text-dim)">maliyet: '+(_mal>0?TL(_mal):'—')+'</div></span></label><input type="text" inputmode="decimal" class="fl-fiyat" id="flf-'+u.id+'" value="'+fiyatHaric+'" placeholder="₺" style="width:75px;text-align:right" oninput="flMarj(\''+u.id+'\')"><div id="flm-'+u.id+'" style="width:46px;text-align:right;font-size:12px;flex:0 0 auto"></div></div>';
    });
  });
  h += '</div>';
  h += '<div style="font-size:11px;color:var(--text-dim);margin-top:8px">Birim fiyatlar KDV hariçtir. Genel toplam/fatura KDV dahil hesaplanır. 🔒 Maliyet ve kâr% yalnız bu ekranda — PDF\'te görünmez.</div>';
  h += '<button class="btn btn-block mt" onclick="fiyatListesiPDF()">📄 PDF Oluştur</button>';
  openModal(h);
  flUrunler.forEach(function(u){ flMarj(u.id); }); // [FL-MARJ-1] açılışta kâr%'leri doldur
}
// [FL-MARJ-1] fiyat yazarken canlı kâr% — teklif ekranıyla aynı tanım: (fiyat−maliyet)/fiyat
function flMarj(uid){
  var u=flUrunler.find(function(x){return x.id===uid;}); if(!u) return;
  var el=document.getElementById('flm-'+uid); if(!el) return;
  var f=trNum((document.getElementById('flf-'+uid)||{}).value)||0;
  var m=Number(u.birim_maliyet)||0;
  if(!(m>0)){ el.innerHTML='<span style="font-size:10px;color:#B7791F">mal.yok</span>'; return; }
  if(!(f>0)){ el.innerHTML=''; return; }
  var yz=(f-m)/f*100;
  var c=yz<0?'var(--red)':(yz<20?'#B7791F':'var(--green)');
  el.innerHTML='<b style="color:'+c+'">%'+Math.round(yz)+'</b>';
}
async function flFirmaDegis(){
  var fid = document.getElementById('flFirma').value;
  if(!fid){ flUrunler.forEach(function(u){ var inp=document.getElementById('flf-'+u.id); if(inp) inp.value = u.varsayilan_fiyat || ''; }); return; }
  var r = await sb.from('firma_urun_fiyat').select('urun_id,birim_fiyat_kdv_haric').eq('firma_id',fid);
  var ff = {}; (r.data||[]).forEach(function(x){ ff[x.urun_id]=x.birim_fiyat_kdv_haric; });
  flUrunler.forEach(function(u){
    var inp = document.getElementById('flf-'+u.id);
    if(!inp) return;
    var bfh = ff[u.id] || u.varsayilan_fiyat;
    inp.value = bfh || '';
  });
  document.querySelectorAll('.flCb').forEach(function(cb){
    var uid=cb.dataset.uid;
    cb.checked = !!ff[uid];
  });
  flUrunler.forEach(function(u){ flMarj(u.id); }); // [FL-MARJ-1] firma fiyatları geldi — kâr%'leri yenile
}
function flSecHepsi(val){ document.querySelectorAll('.flCb').forEach(function(cb){cb.checked=val;}); }
function fiyatListesiPDF(){
  var secili = [];
  document.querySelectorAll('.flCb').forEach(function(cb){
    if(!cb.checked) return;
    var uid = cb.dataset.uid;
    var u = flUrunler.find(function(x){return x.id===uid;});
    if(!u) return;
    var fiyat = document.getElementById('flf-'+uid).value;
    if(!fiyat) return;
    secili.push({ad:u.ad, fiyat:Number(fiyat), gorsel:u.gorsel_url||'', kategori:u.kategori||'diger', gramaj:u.gramaj||'', aciklama:u.aciklama||''});
  });
  if(!secili.length){ alert('En az bir ürün seçin'); return; }
  var firma = document.getElementById('flFirma');
  var firmaAd = firma.selectedIndex>0 ? firma.options[firma.selectedIndex].text : '';
  flGorselUret(secili, firmaAd);
}
// Görsel üret + önizleme + WhatsApp paylaş
async function flGorselUret(secili, firmaAd){
  var bugun = new Date().toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"});
  var katSira = {cup:1,bardak:1,pasta:2,mono:2,cheesecake:3,kruvasan:4,magnolia:5,cookie:6,diger:9};
  var katEt = {cup:'Bardak',bardak:'Bardak',pasta:'Pasta',mono:'Mono Pasta',cheesecake:'Cheesecake',kruvasan:'Kruvasan',magnolia:'Magnolia',cookie:'Cookie',diger:'Di\u011Fer'};
  var gr={}; secili.forEach(function(u){ var k=(u.kategori||'diger'); (gr[k]=gr[k]||[]).push(u); });
  var katlar=Object.keys(gr).sort(function(a,b){return (katSira[a]||8)-(katSira[b]||8);});
  function _flThumb(u){ if(u.gorsel) return '<div style="width:44px;height:44px;border-radius:9px;background-image:url(\''+u.gorsel+'\');background-size:cover;background-position:center"></div>'; return '<div style="width:44px;height:44px;border-radius:9px;background:linear-gradient(135deg,#EAF1FB,#D9E6F7);display:flex;align-items:center;justify-content:center;font-size:20px">\uD83C\uDF70</div>'; }
  var _flBody=katlar.map(function(k){
    var label=katEt[k]||(k.charAt(0).toUpperCase()+k.slice(1));
    var head='<tr><td colspan="4" style="background:#EAF1FB;color:#1E5BA8;font-weight:700;font-size:12px;letter-spacing:1.2px;padding:8px 14px;text-transform:uppercase">'+escapeHtml(label)+'</td></tr>';
    var rs=gr[k].map(function(u,i){ var last=(i===gr[k].length-1); return '<tr style="'+(last?'':'border-bottom:1px solid #F1EBDC')+'"><td style="padding:8px 14px">'+_flThumb(u)+'</td><td style="padding:8px 8px"><div style="font-weight:700;font-size:14px;color:#1A2B40">'+escapeHtml(u.ad)+'</div>'+(u.aciklama?'<div style="font-size:11px;color:#6B7686;margin-top:1px">'+escapeHtml(u.aciklama)+'</div>':'')+'</td><td style="text-align:center;font-size:13px;color:#6B7686;white-space:nowrap">'+(u.gramaj?escapeHtml(u.gramaj):'\u2014')+'</td><td style="text-align:right;padding-right:14px;font-weight:800;font-size:15px;color:#1E5BA8;white-space:nowrap">'+u.fiyat+' \u20BA</td></tr>'; }).join('');
    return head+rs;
  }).join('');
  var _flTable='<table style="width:100%;border-collapse:collapse;background:#fff;border:1px solid #E7DFCB;border-radius:12px;overflow:hidden"><thead><tr style="background:#1E5BA8;color:#fff"><th style="text-align:left;padding:10px 14px;font-size:11px;letter-spacing:.6px;width:60px">G\u00D6RSEL</th><th style="text-align:left;padding:10px 8px;font-size:11px;letter-spacing:.6px">\u00DCR\u00DCN</th><th style="text-align:center;padding:10px 8px;font-size:11px;letter-spacing:.6px;width:78px">GRAMAJ</th><th style="text-align:right;padding:10px 14px;font-size:11px;letter-spacing:.6px;width:108px">B\u0130R\u0130M F\u0130YAT</th></tr></thead><tbody>'+_flBody+'</tbody></table>';
  var box = document.createElement('div');
  box.id = 'flCanvasKaynak';
  box.style.cssText = 'position:fixed;left:-9999px;top:0;width:780px;background:#FAF6E9;padding:34px 34px 26px;font-family:system-ui,Arial,sans-serif';
  box.innerHTML = '<div style="display:flex;align-items:center;gap:14px;border-bottom:2.5px solid #1E5BA8;padding-bottom:12px;margin-bottom:18px"><img src="logo.png" style="width:78px;height:78px;flex:0 0 auto"><div style="flex:1"><div style="font-size:23px;font-weight:800;letter-spacing:3px;color:#1A2B40;text-transform:uppercase">Fiyat Listesi</div><div style="font-size:13px;color:#6B7686;margin-top:5px">'+(firmaAd?escapeHtml(firmaAd.toUpperCase())+' \u00B7 ':'')+bugun+'</div></div><img src="illus-pasta.png" style="width:150px;height:auto;opacity:.92;flex:0 0 auto"></div>'+_flTable+'<div style="display:flex;align-items:center;gap:10px;margin-top:18px;padding-top:12px;border-top:1px solid #E7DFCB"><img src="illus-kruvasan.png" style="width:118px;height:auto;opacity:.88;flex:0 0 auto"><div style="flex:1;text-align:center"><div style="font-size:16px;color:#1E5BA8;font-style:italic">\u201Ciz b\u0131rakan tatlar\u201D</div><div style="font-size:11px;color:#6B7686;margin-top:5px;line-height:1.6">Birim fiyatlar KDV hari\u00E7tir \u00B7 Genel toplam/fatura KDV dahil hesaplan\u0131r<br>BARDAKS GIDA T\u0130CARET LTD. \u015ET\u0130. \u00B7 bardakstr@gmail.com</div></div><div style="width:118px;flex:0 0 auto"></div></div>';
  document.body.appendChild(box);

  openModal('<div class="modal-head"><h3>\uD83D\uDCC4 Fiyat Listesi</h3><button class="modal-close" onclick="closeModal();flTemizle()">\u00D7</button></div><div id="flOnizleme" style="text-align:center;padding:30px"><div class="loading">G\u00F6rsel haz\u0131rlan\u0131yor...</div></div>');

  try{ var _flImg=['logo.png','illus-pasta.png','illus-kruvasan.png'].concat(secili.filter(function(x){return x.gorsel;}).map(function(x){return x.gorsel;})); await Promise.all(_flImg.map(function(s){return new Promise(function(r){var im=new Image(); im.onload=r; im.onerror=r; im.src=s;});})); }catch(_e){}

  try {
    var canvas = await html2canvas(box, {backgroundColor:'#FAF6E9', scale:2, useCORS:true, allowTaint:false, logging:false});
    window._flCanvas = canvas;
    var dataUrl = canvas.toDataURL('image/png');
    var paylasVar = !!(navigator.share);
    document.getElementById('flOnizleme').innerHTML =
      '<img src="'+dataUrl+'" style="max-width:100%;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.15)">'+
      '<div class="row mt" style="gap:8px">'+
      (paylasVar?'<button class="btn" style="flex:2;background:#25D366" onclick="flPaylas()">\uD83D\uDCF2 WhatsApp / Payla\u015F</button>':'')+
      '<button class="btn '+(paylasVar?'btn-sec':'')+'" style="flex:1" onclick="flIndir()">\u2B07\uFE0F \u0130ndir</button>'+
      '</div>'+
      (paylasVar?'':'<div style="font-size:11px;color:var(--text-dim);margin-top:8px">G\u00F6rseli indir, WhatsApp\'tan g\u00F6nder. (Telefonda direkt payla\u015F\u0131m \u00E7\u0131kar)</div>');
  } catch(e){
    document.getElementById('flOnizleme').innerHTML = '<div class="empty">G\u00F6rsel olu\u015Fturulamad\u0131: '+(e.message||e)+'</div>';
  }
  flTemizle();
}
function flTemizle(){ var b=document.getElementById('flCanvasKaynak'); if(b) b.remove(); }
function flIndir(){
  if(!window._flCanvas) return;
  var a = document.createElement('a');
  a.download = 'bardaks-fiyat-listesi-'+today()+'.png';
  a.href = window._flCanvas.toDataURL('image/png');
  a.click();
}
async function flPaylas(){
  if(!window._flCanvas) return;
  window._flCanvas.toBlob(async function(blob){
    var dosya = new File([blob], 'bardaks-fiyat-listesi.png', {type:'image/png'});
    try {
      if(navigator.canShare && navigator.canShare({files:[dosya]})){
        await navigator.share({ files:[dosya], title:'Bardaks Fiyat Listesi', text:'Bardaks G\u00FCnl\u00FCk Tatl\u0131 Fiyat Listesi' });
      } else {
        flIndir();
        alert('Bu cihaz dosya payla\u015F\u0131m\u0131n\u0131 desteklemiyor. G\u00F6rsel indirildi, WhatsApp\'tan g\u00F6nderebilirsin.');
      }
    } catch(e){ if(e.name!=='AbortError') flIndir(); }
  }, 'image/png');
}
async function silUrun(urunId, ad){
  if(!confirm(ad+' satıştan kaldırılsın (pasifleştirilsin) mi? (Veri silinmez, firma fiyatları korunur)')) return;
  await sb.from('urunler').update({aktif:false, guncelleme:new Date().toISOString()}).eq('id',urunId);
  closeModal(); toast('Satıştan kaldırıldı (pasif)', ad); renderUrunler();
}
</script>
